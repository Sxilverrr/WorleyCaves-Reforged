modLoader = "javafml"
loaderVersion = "${forge_range}"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Sxilverr, SuperFluke, booleanbyte"
credits = "Original Worley's Caves by SuperFluke and booleanbyte"
description = "Cave generation with Worley noise"
logoFile = "icon.png"


[[dependencies.${id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft}"
    ordering = "NONE"
    side = "BOTH"
